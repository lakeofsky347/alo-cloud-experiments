[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alo-cloud-experiments"
version = "0.1.0.dev0"
description = "Source-only ALO M1/M2 research scaffold with offline contracts"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
native = ["autogen-agentchat==0.2.40", "docker==7.2.0", "numpy>=1.26,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
